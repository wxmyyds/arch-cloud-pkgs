name: Build rtk-termux

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'rtk 版本 tag (留空=PKGBUILD里的 pkgver, 例: 0.46.0)'
        required: false
        type: string
  push:
    paths:
      - 'pkgs/rtk-termux/**'
      - '.github/workflows/build-rtk-termux.yml'

concurrency:
  group: build-rtk-termux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: 创建构建用户
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: 安装基础工具
        run: |
          pacman -Syu --noconfirm git sudo base-devel rustup android-ndk 2>&1 || pacman -Syu --noconfirm git sudo base-devel rustup
          # rustup 安装 toolchain
          rustup toolchain install stable --profile minimal || true
          rustup default stable || true
          rustup target add aarch64-linux-android || true
          # cargo-ndk 需 cargo 安装
          cargo install cargo-ndk --locked 2>&1 || sudo -u builder cargo install cargo-ndk --locked || true
          cargo ndk --version 2>&1 || ~/.cargo/bin/cargo-ndk --version 2>&1 || true
          ls /opt/android-ndk 2>&1 | head; ls /usr/share/android-ndk 2>&1 | head || true

      - name: 覆盖 pkgver（如果手动指定版本）
        if: inputs.version != ''
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ inputs.version }}/" pkgs/rtk-termux/PKGBUILD
          cat pkgs/rtk-termux/PKGBUILD | grep pkgver

      - name: 恢复 cargo 缓存
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            pkgs/rtk-termux/src
          key: rtk-termux-${{ hashFiles('pkgs/rtk-termux/PKGBUILD') }}
          restore-keys: |
            rtk-termux-

      - name: 构建 rtk-termux
        run: |
          set -e
          d="pkgs/rtk-termux"
          chown -R builder:builder "$d" /home/builder/.cargo 2>/dev/null || true
          chown -R builder:builder /opt/android-ndk 2>/dev/null || true
          # rustup target 由 cargo-ndk 自动处理，但先确保
          sudo -u builder rustup target add aarch64-linux-android 2>&1 || rustup target add aarch64-linux-android 2>&1 || true
          echo "::group::makepkg"
          (cd "$d" && sudo -u builder makepkg -sf --noconfirm)
          echo "::endgroup::"
          ls -lh "$d"/*.pkg.tar.zst 2>/dev/null || true
          ls -lh "$d"/rtk-aarch64-android 2>/dev/null || true
          file "$d"/rtk-aarch64-android 2>/dev/null || file "$d"/src/rtk/target/aarch64-linux-android/release/rtk 2>/dev/null || true
          # 重命名 pacman 包为 .pacman（与你现有约定一致）
          for f in "$d"/*.pkg.tar.zst; do [ -f "$f" ] && mv "$f" "${f%.pkg.tar.zst}.pacman"; done

      - name: 上传 pacman 包
        uses: actions/upload-artifact@v4
        with:
          name: rtk-termux-pacman
          path: pkgs/rtk-termux/*.pacman
          retention-days: 7
          if-no-files-found: warn

      - name: 上传裸二进制（给 Termux curl 用）
        uses: actions/upload-artifact@v4
        with:
          name: rtk-aarch64-android
          path: |
            pkgs/rtk-termux/rtk-aarch64-android
            pkgs/rtk-termux/src/rtk/target/aarch64-linux-android/release/rtk
          retention-days: 7
          if-no-files-found: error
