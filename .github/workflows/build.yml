name: Build packages

on:
  workflow_dispatch:
  push:
    paths:
      - 'pkgs/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: 安装基础工具
        run: |
          pacman -Syu --noconfirm git sudo

      - name: 创建构建用户（makepkg 拒绝 root）
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - name: Checkout
        uses: actions/checkout@v4

      - name: 构建所有包
        run: |
          set -e
          for d in pkgs/*/; do
            pkg=$(basename "$d")
            echo "::group::构建 $pkg"
            chown -R builder:builder "$d"
            (cd "$d" && sudo -u builder makepkg -sf --noconfirm)
            # 产物改用 .pacman 扩展名（与 fpm/tauri/electron-builder 约定一致），
            # 本质仍为标准 pacman 包，pacman -U 可直接安装
            for f in "$d"/*.pkg.tar.zst; do
              [ -f "$f" ] && mv "$f" "${f%.pkg.tar.zst}.pacman"
            done
            echo "::endgroup::"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: pkgs/*/*.pacman
          retention-days: 30
          if-no-files-found: error
