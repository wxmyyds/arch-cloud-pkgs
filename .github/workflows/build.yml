name: Build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '要构建的包，逗号分隔（如: we-layerd,wayland-pipewire-idle-inhibit-aur）。留空 = 全部'
        required: false
        type: string
  push:
    paths:
      - 'pkgs/**'
      - '.github/workflows/build.yml'

# 同一分支的新提交会取消仍在跑的旧构建，避免重复占用 runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 选包 job：跑在裸 ubuntu 上（不进 arch 容器），只算"本次要构建哪些包"，
  # 输出 JSON 数组给 build 的 matrix 用；空数组时 build 直接跳过
  select:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.select.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要历史才能 diff 出变更的包

      - name: 确定要构建的包列表
        id: select
        run: |
          set -euo pipefail
          select_pkgs() {
            # 手动触发：用输入指定的包；留空则全部
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              INPUT="${{ inputs.packages }}"
              if [ -n "$INPUT" ]; then
                echo "$INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
              else
                ls -d pkgs/*/ | xargs -n1 basename
              fi
              return
            fi
            # push 触发：diff 出变更的包，但只保留目录仍存在的
            # （删除的包没有可构建的东西，跳过而不是报错）
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              # 新分支首个 push：没有可 diff 的基线，构建全部
              ls -d pkgs/*/ | xargs -n1 basename
              return
            fi
            git diff --name-only "$BEFORE" HEAD -- pkgs/ | cut -d/ -f2 | sort -u | while IFS= read -r n; do
              if [ -d "pkgs/$n" ]; then
                echo "$n"
              fi
            done
          }
          mapfile -t names < <(select_pkgs)
          # 校验包目录存在（手动输入的包名可能拼错）
          for n in "${names[@]}"; do
            if [ ! -d "pkgs/$n" ]; then
              echo "::error::未找到包目录 pkgs/$n"
              exit 1
            fi
          done
          if [ ${#names[@]} -eq 0 ]; then
            echo "json=[]" >> "$GITHUB_OUTPUT"
            echo "本次无包需要构建（仅 workflow/非包文件变更）"
          else
            echo "json=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
            echo "本次构建: ${names[*]}"
          fi

  # matrix：每个包一个独立 job 并行构建，互不干扰，单包失败不影响其他包
  build:
    needs: select
    if: needs.select.outputs.pkgs != '[]'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(needs.select.outputs.pkgs) }}
    steps:
      - name: 创建构建用户（makepkg 拒绝 root）
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 选包已在 select job 完成，这里浅克隆即可

      # 同步数据库（makepkg -s 需要 core/extra DB，否则报 database file does not exist）
      - name: 同步 pacman 数据库
        run: pacman -Sy --noconfirm

      # 工具链下沉到各包 PKGBUILD 的 makedepends，由 makepkg -s 自动安装
      # rtk-termux 额外需要 android-ndk(额外下载) + cargo-ndk(AUR/cargo) + rustup target
      - name: 准备交叉工具链（按包按需）
        run: |
          set -e
          case "${{ matrix.pkg }}" in
            rtk-termux)
              # android-ndk 在 AUR，不在官方 DB，需手动装（若 makepkg 已装则跳过）
              if ! pacman -Qi android-ndk >/dev/null 2>&1; then
                echo "安装 android-ndk (约 1.2GB，需几分钟)"
                # 官方直链 + 静默安装到 /opt/android-ndk
                # 若 pacman 官方未来有则优先
                pacman -S --noconfirm android-ndk 2>&1 && echo "pacman 装 android-ndk 成功" || {
                  echo "pacman 无 android-ndk，走官方 zip 直装"
                  curl -fsSL https://dl.google.com/android/repository/android-ndk-r26d-linux.zip -o /tmp/ndk.zip
                  mkdir -p /opt && unzip -q /tmp/ndk.zip -d /opt
                  mv /opt/android-ndk-r26d /opt/android-ndk
                  ln -sf /opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android* /usr/bin/ 2>/dev/null || true
                  rm /tmp/ndk.zip
                }
              fi
              # builder 的 rustup 环境与 root 不同，需两边都设 default
              pacman -S --needed --noconfirm rustup 2>&1 || true
              rustup toolchain install stable --profile minimal 2>&1 || true
              rustup default stable 2>&1 || true
              sudo -u builder bash -c 'rustup toolchain install stable --profile minimal 2>&1 || true; rustup default stable 2>&1 || true' || true
              if ! command -v cargo-ndk >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo-ndk" ] && [ ! -x "/home/builder/.cargo/bin/cargo-ndk" ]; then
                cargo install cargo-ndk --locked 2>&1 || sudo -u builder bash -c 'cargo install cargo-ndk --locked' 2>&1 || true
              fi
              sudo -u builder rustup target add aarch64-linux-android 2>&1 || rustup target add aarch64-linux-android 2>&1 || true
              cargo ndk --version 2>&1 || ~/.cargo/bin/cargo-ndk --version 2>&1 || /home/builder/.cargo/bin/cargo-ndk --version 2>&1 || true
              ;;
            *)
              echo "包 ${{ matrix.pkg }} 无额外工具链，按 PKGBUILD makedepends 自动安装"
              ;;
          esac

      # 缓存 cargo registry/git + 上次构建的 src/（含 cargo target 目录）。
      # 命中时同版本重建 = 增量编译，从 15~30 分钟降到几分钟；
      # 键含 PKGBUILD 哈希，升级 pkgver 等任何改动会自动失效（全量重编一次）。
      # 缓存故障（超过 10GB 配额、网络等）不阻断构建。
      - name: 恢复构建缓存
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            pkgs/${{ matrix.pkg }}/src
          key: build-${{ matrix.pkg }}-${{ hashFiles(format('pkgs/{0}/PKGBUILD', matrix.pkg)) }}
          restore-keys: |
            build-${{ matrix.pkg }}-

      - name: 构建 ${{ matrix.pkg }}
        run: |
          set -e
          d="pkgs/${{ matrix.pkg }}"
          # 缓存以 root 恢复，先归还给 builder（读写都需要）
          chown -R builder:builder "$d" /home/builder/.cargo 2>/dev/null || true
          if [ "${{ matrix.pkg }}" = "rtk-termux" ]; then
            chown -R builder:builder /opt/android-ndk 2>/dev/null || true
            sudo -u builder rustup target add aarch64-linux-android 2>&1 || true
          fi
          echo "::group::构建 ${{ matrix.pkg }}"
          (cd "$d" && sudo -u builder makepkg -sf --noconfirm)
          # 产物改用 .pacman 扩展名（与 fpm/tauri/electron-builder 约定一致），
          # 本质仍为标准 pacman 包，pacman -U 可直接安装
          for f in "$d"/*.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "${f%.pkg.tar.zst}.pacman"
          done
          echo "::endgroup::"

      - name: 上传单包产物
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages-${{ matrix.pkg }}
          path: |
            pkgs/${{ matrix.pkg }}/*.pacman
            pkgs/${{ matrix.pkg }}/rtk-aarch64-android
          retention-days: 30
          if-no-files-found: error

  # 把所有单包产物合并成一个 arch-packages，保持原有下载习惯；
  # 任一包失败时跳过合并（成功的包仍可从 arch-packages-<包名> 下载）
  merge:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: arch-packages-*
          merge-multiple: true
          path: merged
      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: merged
          retention-days: 30
