# rtk-termux 构建需求声明 — 工作流按此文件按需准备，无需硬编码包名
# 声明式配置，工作流通用解析

# 是否需要 Android NDK（不在官方仓库，需官方 zip 直装）
needs_ndk=true
ndk_version=r26d
ndk_platform=28

# 是否需要 cargo-ndk（cargo 安装）
needs_cargo_ndk=true

# 需要的 rust targets（空格分隔）
rust_targets="aarch64-linux-android"

# 额外 pacman 依赖（空格分隔，会在 cargo 之前装）
extra_pacman_deps="unzip rustup clang"
